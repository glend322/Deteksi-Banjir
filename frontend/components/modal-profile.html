<!-- ==========================================================================
     SafeRoute Modal: Profil & Pengaturan
     ========================================================================== -->
<div id="modalProfile" class="modal-overlay">
    <div class="modal-dialog">
        <div class="modal-header">
            <div class="modal-title">
                <button class="btn-close-modal" style="margin-right: 4px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                </button>
                Profil & Pengaturan
            </div>
            <button class="btn-close-modal" style="font-size: 20px;">&times;</button>
        </div>

        <div class="modal-body">
            <div class="profile-card-header">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Avatar" class="profile-avatar-large">
                <div>
                    <div class="profile-name">Andi Pratama</div>
                    <div class="profile-email">andi.pratama@gmail.com</div>
                </div>
            </div>

            <div class="settings-list">
                <div class="settings-item">
                    <div>
                        <div class="settings-item-title">Kendaraan Utama</div>
                        <div class="settings-item-desc">Menyesuaikan kalkulasi toleransi batas banjir rute</div>
                    </div>
                    <select id="profileVehicleSelect" class="settings-select">
                        <option>Mobil City Car (Maks 35 cm)</option>
                        <option>Motor Matic (Maks 20 cm)</option>
                        <option>Mobil SUV Tinggi (Maks 50 cm)</option>
                    </select>
                </div>

                <div class="settings-item">
                    <div>
                        <div class="settings-item-title">Lokasi Tersimpan</div>
                        <div class="settings-item-desc">Rumah, Kantor, Kampus Undip</div>
                    </div>
                    <span style="font-size: 12px; font-weight: 700; color: var(--primary);">3 Tersimpan ></span>
                </div>

                <div class="settings-item">
                    <div>
                        <div class="settings-item-title">Mode Offline / PWA</div>
                        <div class="settings-item-desc">Peta offline & nomor posko darurat lokal</div>
                    </div>
                    <span style="font-size: 11px; font-weight: 800; color: var(--status-safe); background: #D1FAE5; padding: 3px 8px; border-radius: 6px;">Aktif (Siaga)</span>
                </div>
            </div>
        </div>
    </div>
</div>
