<!-- ==========================================================================
     SafeRoute Modal: Laporkan Banjir
     ========================================================================== -->
<div id="modalReport" class="modal-overlay">
    <div class="modal-dialog">
        <div class="modal-header">
            <div class="modal-title">
                <button class="btn-close-modal" style="margin-right: 4px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                </button>
                Laporkan Kondisi Banjir
            </div>
            <button class="btn-close-modal" style="font-size: 20px;">&times;</button>
        </div>

        <div class="modal-body">
            <!-- Step 1: Lokasi -->
            <div class="report-step">
                <div class="step-label">
                    <span class="step-num">1</span>
                    Lokasi Genangan
                </div>
                <input id="reportLocationInput" type="text" class="input-field" value="Jl. Madukoro Raya, Semarang Barat">
                <button id="btnUseMyLocation" type="button" style="align-self: flex-start; font-size: 12px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 4px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
                    Gunakan Lokasi GPS Saya
                </button>
            </div>

            <!-- Step 2: Foto -->
            <div class="report-step">
                <div class="step-label">
                    <span class="step-num">2</span>
                    Foto Kondisi Air
                </div>
                <div class="photo-upload-grid">
                    <div class="photo-slot">
                        <img src="assets/cctv_kaligawe.jpg" alt="Foto 1">
                    </div>
                    <div class="photo-slot">
                        <img src="assets/cctv_kaligawe.jpg" alt="Foto 2">
                    </div>
                    <div class="photo-slot" style="color: var(--text-muted);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        <span style="font-size: 10px; font-weight: 700;">Tambah</span>
                    </div>
                </div>
            </div>

            <!-- Step 3: Kedalaman -->
            <div class="report-step">
                <div class="step-label">
                    <span class="step-num">3</span>
                    Perkiraan Kedalaman Air
                </div>
                <div class="options-pill-group">
                    <button class="option-pill-btn" data-depth="lt20" type="button">&lt; 20 cm</button>
                    <button class="option-pill-btn" data-depth="2040" type="button">20–40 cm</button>
                    <button class="option-pill-btn active" data-depth="4070" type="button">40–70 cm</button>
                    <button class="option-pill-btn" data-depth="gt70" type="button">&gt; 70 cm</button>
                </div>
            </div>

            <!-- Step 4: Status Jalan -->
            <div class="report-step">
                <div class="step-label">
                    <span class="step-num">4</span>
                    Kondisi Kelayakan Jalan
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                    <button class="option-pill-btn" data-condition="safe" type="button">Aman</button>
                    <button class="option-pill-btn" data-condition="flooded" type="button">Tergenang</button>
                    <button class="option-pill-btn active" data-condition="impassable" type="button">Tidak Dapat Dilalui</button>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button id="btnSubmitReport" class="btn-view-route" type="button">
                Kirim & Verifikasi AI
            </button>
        </div>
    </div>
</div>
