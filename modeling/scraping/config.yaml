sources:
  bmkg:
    base_url: "https://cuaca.bmkg.go.id"
    api_url: "https://api.bmkg.go.id/publik/prakiraan-cuaca"
    rate_limit: 1  # requests per second
    cache_dir: "../data/raw/bmkg"

  osm:
    overpass_url: "https://overpass-api.de/api/interpreter"
    rate_limit: 1
    cache_dir: "../data/raw/osm"

  kaggle:
    dataset_slug: "ism401/flood-detection-dataset"
    download_dir: "../data/raw/kaggle"

  dem:
    source: "USGS SRTM"
    resolution: "30m"
    tiles: "S08E110"  # Semarang tile
    download_dir: "../data/raw/dem"

semarang_bounds:
  lat_min: -7.05
  lat_max: -6.85
  lng_min: 110.35
  lng_max: 110.55
