model:
  type: "xgboost"  # xgboost | lightgbm | lstm | ensemble
  random_state: 42

features:
  rainfall_hours: [1, 3, 6, 12, 24]  # hourly rainfall aggregates
  elevation_bins: [0, 5, 10, 20, 50, 100]
  drain_density_thresholds: [0.5, 1.0, 2.0]
  land_use_categories: ["residential", "commercial", "industrial", "green", "water", "road"]

training:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 50
  cv_folds: 5
  seed: 42

prediction:
  time_windows: ["1h", "3h", "6h"]
  probability_thresholds:
    normal: 0.2
    waspada: 0.5
    tergenang: 0.8
    tidak_dapat_dilalui: 1.0

output:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
