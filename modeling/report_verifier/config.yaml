rules:
  rainfall_boost:
    threshold_mm_per_hr: 10
    window_hours: 2
    confidence_boost: 0.25

  nearby_reports:
    radius_meters: 500
    window_hours: 1
    min_reports: 3
    confidence_boost: 0.20

  cv_confirmation:
    confidence_boost: 0.30

  suspicious_flags:
    deep_flood_no_rain: true
    no_nearby_reports: true
    contradiction_threshold: 0.3

  historical_hotspot:
    confidence_boost: 0.15

scoring:
  base_confidence: 0.5
  verified_threshold: 0.70
  unverified_threshold: 0.40
  flagged_threshold: 0.20

output:
  statuses: ["verified", "unverified", "flagged"]
