version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: saferoute_postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: saferoute_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saferoute_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:

